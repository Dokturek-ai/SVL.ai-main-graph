    - Procedure: Diagnostický nebo terapeutický výkon

    ---Input Text---
    ```
    Arteriální hypertenze je definována jako opakovaně zvýšený krevní tlak ≥ 140/90 mmHg. Cílový krevní tlak u většiny pacientů je pod 140/90 mmHg. Lékem první volby jsou ACE inhibitory, například ramipril. K potvrzení diagnózy slouží 24hodinové ambulantní monitorování krevního tlaku (ABPM).
    ```

    ---Output---
    entity{tuple_delimiter}Arteriální Hypertenze{tuple_delimiter}Condition{tuple_delimiter}Onemocnění definované jako opakovaně zvýšený krevní tlak ≥ 140/90 mmHg; cílová hodnota je pod 140/90 mmHg.
    entity{tuple_delimiter}Krevní Tlak{tuple_delimiter}LabTest{tuple_delimiter}Měřená veličina používaná k definici a monitorování arteriální hypertenze, s cílovou hodnotou pod 140/90 mmHg.
    entity{tuple_delimiter}ACE Inhibitory{tuple_delimiter}Medication{tuple_delimiter}Léková skupina představující lék první volby v léčbě arteriální hypertenze.
    entity{tuple_delimiter}Ramipril{tuple_delimiter}Drug{tuple_delimiter}Konkrétní účinná látka ze skupiny ACE inhibitorů uváděná jako příklad léčby.
    entity{tuple_delimiter}ABPM{tuple_delimiter}Procedure{tuple_delimiter}24hodinové ambulantní monitorování krevního tlaku sloužící k potvrzení diagnózy hypertenze.
    relation{tuple_delimiter}Arteriální Hypertenze{tuple_delimiter}ACE Inhibitory{tuple_delimiter}léčba, první volba{tuple_delimiter}ACE inhibitory jsou lékem první volby v léčbě arteriální hypertenze.
    relation{tuple_delimiter}ACE Inhibitory{tuple_delimiter}Ramipril{tuple_delimiter}příklad, účinná látka{tuple_delimiter}Ramipril je konkrétní účinná látka ze skupiny ACE inhibitorů.
    relation{tuple_delimiter}Arteriální Hypertenze{tuple_delimiter}ABPM{tuple_delimiter}diagnostika, potvrzení{tuple_delimiter}ABPM slouží k potvrzení diagnózy arteriální hypertenze.
    relation{tuple_delimiter}Arteriální Hypertenze{tuple_delimiter}Krevní Tlak{tuple_delimiter}definice, monitorování{tuple_delimiter}Arteriální hypertenze je definována a monitorována hodnotou krevního tlaku.
    {completion_delimiter}
  - |
    ---Entity Types---
    - Condition: Onemocnění, porucha nebo klinický stav
    - Drug: Konkrétní účinná látka nebo léčivo
    - LabTest: Laboratorní test, vyšetření nebo měřená veličina
    - Symptom: Příznak nebo klinický projev

    ---Input Text---
    ```
    Diabetes mellitus 2. typu je metabolické onemocnění charakterizované hyperglykémií. Diagnóza se stanoví při glykovaném hemoglobinu (HbA1c) ≥ 48 mmol/mol nebo glykémii nalačno ≥ 7,0 mmol/l. Metformin je lékem první volby. Mezi typické příznaky patří polyurie a polydipsie.
    ```

    ---Output---
    entity{tuple_delimiter}Diabetes Mellitus 2. Typu{tuple_delimiter}Condition{tuple_delimiter}Metabolické onemocnění charakterizované hyperglykémií, diagnostikované podle HbA1c nebo glykémie nalačno.
    entity{tuple_delimiter}HbA1c{tuple_delimiter}LabTest{tuple_delimiter}Glykovaný hemoglobin; diagnostické kritérium diabetu při hodnotě ≥ 48 mmol/mol.
    entity{tuple_delimiter}Glykémie Nalačno{tuple_delimiter}LabTest{tuple_delimiter}Laboratorní hodnota glykémie nalačno; diagnostické kritérium diabetu při ≥ 7,0 mmol/l.
    entity{tuple_delimiter}Metformin{tuple_delimiter}Drug{tuple_delimiter}Konkrétní léčivo uváděné jako lék první volby u diabetu 2. typu.
    entity{tuple_delimiter}Polyurie{tuple_delimiter}Symptom{tuple_delimiter}Typický příznak diabetu 2. typu — zvýšené močení.
    entity{tuple_delimiter}Polydipsie{tuple_delimiter}Symptom{tuple_delimiter}Typický příznak diabetu 2. typu — zvýšená žízeň.
    relation{tuple_delimiter}Diabetes Mellitus 2. Typu{tuple_delimiter}HbA1c{tuple_delimiter}diagnostika, kritérium{tuple_delimiter}HbA1c ≥ 48 mmol/mol je diagnostickým kritériem diabetu 2. typu.
    relation{tuple_delimiter}Diabetes Mellitus 2. Typu{tuple_delimiter}Metformin{tuple_delimiter}léčba, první volba{tuple_delimiter}Metformin je lékem první volby u diabetu 2. typu.
    relation{tuple_delimiter}Diabetes Mellitus 2. Typu{tuple_delimiter}Polyurie{tuple_delimiter}příznak{tuple_delimiter}Polyurie je typickým příznakem diabetu 2. typu.
    relation{tuple_delimiter}Diabetes Mellitus 2. Typu{tuple_delimiter}Polydipsie{tuple_delimiter}příznak{tuple_delimiter}Polydipsie je typickým příznakem diabetu 2. typu.
    {completion_delimiter}

