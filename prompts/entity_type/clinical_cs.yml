# Clinical entity-extraction prompt profile for SVL doporučené postupy (Czech).
# Wired via ENTITY_TYPE_PROMPT_FILE=clinical_cs.yml (loaded from PROMPT_DIR/entity_type).
#
# The entity types are aligned with the promotion pass enum
# (promotion/enums/entity_types.yaml, spec 001 G5) so extraction emits the exact
# clinical kinds the promotion pass validates and the mkn10 linkage needs — a type
# outside the enum is mapped to `Other` at promotion. Examples are Czech clinical
# text so the extractor learns the domain, not the generic story/research defaults.
#
# Both text- and json-mode examples are provided so the profile is valid whether
# ENTITY_EXTRACTION_USE_JSON is false (default, delimiter text) or true.

entity_types_guidance: |
  Klasifikuj každou entitu jedním z následujících typů. Pokud žádný nesedí, použij `Other`.

  - Condition: Onemocnění, porucha nebo klinický stav (např. arteriální hypertenze, diabetes mellitus 2. typu, chronické srdeční selhání)
  - Diagnosis: Explicitně uvedená diagnóza nebo diagnostická jednotka/kategorie (kandidát na MKN-10 kód)
  - Medication: Léková skupina nebo třída léčiv (např. ACE inhibitory, betablokátory, statiny)
  - Drug: Konkrétní účinná látka nebo léčivo (např. ramipril, metformin, atorvastatin)
  - Symptom: Příznak nebo klinický projev (např. dušnost, bolest na hrudi, polyurie)
  - Procedure: Diagnostický nebo terapeutický výkon (např. EKG, echokardiografie, ABPM)
  - LabTest: Laboratorní test, vyšetření nebo měřená veličina (např. HbA1c, kreatinin, krevní tlak, glykémie)
  - Concept: Obecný klinický pojem, princip nebo doporučení (např. cílová hodnota, kardiovaskulární riziko)
  - Person: Osoba nebo role (např. praktický lékář, pacient, ambulantní specialista)
  - Organization: Organizace nebo instituce (např. SVL ČLS JEP, ÚZIS)
  - Other: Cokoli, co nespadá do výše uvedených typů

entity_extraction_examples:
  - |
    ---Entity Types---
    - Condition: Onemocnění, porucha nebo klinický stav
    - Medication: Léková skupina nebo třída léčiv
