# Controlled entity-type enum (G5). Names the clinical kinds the downstream
# mkn10 linkage needs, so the emit signals diagnosis/drug resolution candidates.
# A promoted entity whose extracted type is not in this set is mapped to `Other`.
types:
  - Condition      # a clinical condition / diagnosis (mkn10_code candidate)
  - Diagnosis
  - Medication     # a drug / medication (cui / SÚKL candidate)
  - Drug
  - Symptom
  - Procedure
  - LabTest
  - Concept        # generic clinical concept
  - Person
  - Organization
  - Other
  # Non-clinical layout/admin artifacts the extraction emits (table rows, figures,
  # boilerplate). Surfaced as their own type — NOT collapsed to `Other` — so the
  # downstream mkn10 harvest can EXCLUDE them from disease-subject resolution
  # (clinical-vs-admin, contract field #4). Never a clinical fact endpoint.
  - Table
  - Drawing
  - Content
